<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>作品｜Ame 雨音 貼紙手帳</title>
  <meta name="description" content="Ame 雨音作品詳細頁：作品大圖、創作理念與更多圖片。">
  <script>document.documentElement.classList.add('js');</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=LXGW+WenKai+TC:wght@400;700&family=Noto+Sans+TC:wght@400;500;700&display=swap">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/hero.css">
  <link rel="stylesheet" href="css/gallery.css">
  <link rel="stylesheet" href="css/lightbox.css">
  <link rel="stylesheet" href="css/effects.css">
  <link rel="stylesheet" href="css/pages.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body data-page="works">

  <header class="site-nav" id="siteNav">
    <div class="container">
      <a class="logo" href="index.html#home" aria-label="Ame 雨音 首頁">
        <svg class="heart" viewBox="0 0 32 32" aria-hidden="true"><path d="M16 28s-11-6.6-11-15A6 6 0 0 1 16 9a6 6 0 0 1 11 4c0 8.4-11 15-11 15z" fill="#f19ab0" stroke="#fff" stroke-width="3" paint-order="stroke"/></svg>
        <span class="script">Ame</span> 雨音
      </a>
      <nav aria-label="主要導覽">
        <ul class="nav-links">
          <li><a href="index.html#home" data-section="home">Home</a></li>
          <li><a href="index.html#works" data-section="works">Works</a></li>
          <li><a href="index.html#exhibition" data-section="exhibition">Exhibition</a></li>
          <li><a href="about.html" data-page="about">About</a></li>
          <li><a href="contact.html" data-page="contact">Contact</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main id="detail">
    <!-- Hero Image：捲動時視差 -->
    <div class="detail-hero" aria-hidden="true">
      <img id="dHeroImg" src="images/midori-01.jpg" alt="">
      <span class="tape"></span>
    </div>

    <div class="container">
      <a class="btn-ghost detail-back" href="index.html#works">← 回到作品集</a>

      <!-- 手帳跨頁 -->
      <article class="spread">
        <div class="spread__page">
          <header class="detail-title reveal-up">
            <h1 id="dTitle">格紋心事</h1>
          </header>
          <div class="detail-tags reveal-up">
            <span class="tag-sticker"><span class="dot-sticker" aria-hidden="true">📅</span><span id="dYear">2026</span> <small>創作年份</small></span>
            <span class="tag-sticker"><span class="dot-sticker" aria-hidden="true"><img id="dFace" src="images/face-midori.jpg" alt=""></span><span id="dChar">Midori 翠</span> <small>角色分類</small></span>
          </div>
          <p class="detail-desc reveal-up" id="dDesc"></p>
          <section class="note detail-note reveal-up" aria-labelledby="conceptTitle">
            <h2 id="conceptTitle">創作理念</h2>
            <p id="dConcept"></p>
          </section>
          <section class="note detail-note detail-note--prompt reveal-up" id="dPromptBox" aria-labelledby="promptTitle" hidden>
            <h2 id="promptTitle">生成提示詞</h2>
            <p id="dPrompt"></p>
          </section>
        </div>
        <div class="spread__page spread__page--image">
          <figure class="sticker reveal-up">
            <span class="tape" aria-hidden="true"></span>
            <button type="button" class="detail-zoom" id="dZoom" aria-label="放大檢視">
              <img id="dImg" src="images/midori-01.jpg" alt="" width="1024" height="1024">
            </button>
          </figure>
        </div>
      </article>
    </div>

    <!-- 更多圖片 -->
    <section class="section" aria-labelledby="moreTitle">
      <span class="float-sticker dot-sticker" style="--size:66px; top:60px; right:5%; --r:10deg" data-speed="0.5" aria-hidden="true">🎀</span>
      <div class="container">
        <div class="section-head">
          <span class="eyebrow">more pages</span>
          <h2 id="moreTitle">同一本手帳的其他頁</h2>
          <span class="tape" aria-hidden="true"></span>
        </div>
        <ul class="more-grid" id="dMore"></ul>

        <nav class="pager" aria-label="上一件與下一件作品">
          <a class="pager__link" id="dPrev" href="#"><span class="script">← prev</span><strong></strong></a>
          <a class="btn-ghost" href="index.html#works">全部作品</a>
          <a class="pager__link" id="dNext" href="#" style="text-align:right"><span class="script">next →</span><strong></strong></a>
        </nav>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <span><span class="script">Ame</span> 雨音 · sticker diary 2026</span>
      <span>Ame 雨音為虛構藝術家，作品皆由 AI 生成 · 網站設計 <span data-designer>（你的名字）</span> × AI</span>
    </div>
  </footer>

  <script src="js/works.js"></script>
  <script src="js/work.js"></script>
  <script src="js/lightbox.js"></script>
  <script src="js/effects.js"></script>
</body>
</html>
